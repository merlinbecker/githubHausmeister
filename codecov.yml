codecov:
  require_ci_to_pass: yes
  notify:
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
    patch:
      default:
        target: auto
        threshold: 1%
        base: auto

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "tests/**/*"
  - "**/*.config.*"
  - "**/*.d.ts"
  - "dist/**/*"
  - "build/**/*"
  - "coverage/**/*"
  - "vitest.setup.ts"
  - "client/src/components/ui/**/*"  # shadcn/ui components don't need high coverage