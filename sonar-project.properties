# SonarQube project configuration for GitHub Hausmeister

# Project identification
sonar.projectKey=merlinbecker_githubHausmeister
sonar.organization=merlinbecker

# Source code and test directories
sonar.sources=client/src,server,shared
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# File exclusions
sonar.exclusions=**/*.d.ts,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.*,**/vitest.setup.ts

# TypeScript specific settings
sonar.typescript.tsconfigPath=tsconfig.json

# Quality gates
sonar.qualitygate.wait=true